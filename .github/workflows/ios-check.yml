name: iOS build check

on:
  push:
    branches: [codex/ios-readiness]
    paths: ['mobile_app/**', '.github/workflows/ios-check.yml']
  pull_request:
    paths: ['mobile_app/**', '.github/workflows/ios-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter 3.47.4
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive=flutter_macos_arm64_3.47.4-stable.zip
              checksum=c6af6fa1d64946167b8637ba4c5a7bb3b8574729a1ebe931decd4924dbab7061 ;;
            x86_64)
              archive=flutter_macos_3.47.4-stable.zip
              checksum=72ced0f81a5ea48f30d221699fa45378cdd1fa15426512444f32e4e1bee9db8b ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive" -o "$RUNNER_TEMP/flutter.zip"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/flutter.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Record environment and resolve dependencies
        run: |
          set -euo pipefail
          mkdir -p build/ios-validation
          flutter --version | tee build/ios-validation/flutter-version.txt
          xcodebuild -version | tee build/ios-validation/xcode-version.txt
          flutter config --no-analytics
          flutter precache --ios
          flutter pub get --enforce-lockfile
      - name: Analyze and test shared iOS logic
        run: |
          set -euo pipefail
          flutter analyze 2>&1 | tee build/ios-validation/analyze.txt
          flutter test --reporter expanded 2>&1 | tee build/ios-validation/tests.txt
      - name: Build iOS simulator app
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug 2>&1 | tee build/ios-validation/simulator-build.txt
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app build/ios-validation/ios-simulator-app.zip
      - name: Compile unsigned iPhone app
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign 2>&1 | tee build/ios-validation/device-build.txt
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios-validation/ios-unsigned-device-app.zip
      - name: Launch simulator app and capture startup
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build/ios-validation/simulators.json
          simulator=$(python3 -c 'import json; d=json.load(open("build/ios-validation/simulators.json")); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" build/ios/iphonesimulator/Runner.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist)
          xcrun swiftc tool/check_ios_startup.swift -o build/ios-validation/check-ios-startup
          xcrun simctl launch --console "$simulator" "$bundle_id" > build/ios-validation/simulator-launch.txt 2>&1 &
          launch_monitor=$!
          trap 'kill "$launch_monitor" 2>/dev/null || true' EXIT
          # A successful launch command is insufficient: cold simulators can
          # still display an empty launch screen after several seconds.
          startup_ready=false
          for attempt in $(seq 1 18); do
            sleep 5
            xcrun simctl io "$simulator" screenshot build/ios-validation/simulator-startup.png
            if build/ios-validation/check-ios-startup build/ios-validation/simulator-startup.png > build/ios-validation/startup-recognition.txt; then
              startup_ready=true
              break
            fi
          done
          if [ "$startup_ready" != true ]; then
            echo "The overview did not become visible; inspect the screenshot and simulator-launch.txt."
            exit 1
          fi
      - name: Upload build logs and startup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          path: |
            mobile_app/build/ios-validation/*.txt
            mobile_app/build/ios-validation/*.json
            mobile_app/build/ios-validation/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload successful app bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundles-${{ github.sha }}
          path: mobile_app/build/ios-validation/*.zip
          retention-days: 7
          if-no-files-found: warn
